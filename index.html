<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambi — 3D Ambigram Generator</title>
    <meta
      name="description"
      content="Browser-based 3D ambigram generator. Type two words of equal length, pick fonts, and generate a 3D-printable ambigram mesh."
    >
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ambi.janosilles.com">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16171d">
    <meta property="og:title" content="Ambi — 3D Ambigram Generator">
    <meta
      property="og:description"
      content="Browser-based 3D ambigram generator. Type two words of equal length, pick fonts, and generate a 3D-printable ambigram mesh."
    >
    <meta property="og:url" content="https://ambi.janosilles.com">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Ambi — 3D Ambigram Generator">
    <meta
      name="twitter:description"
      content="Browser-based 3D ambigram generator. Type two words of equal length, pick fonts, and generate a 3D-printable ambigram mesh."
    >
    <meta name="twitter:image" content="/favicon.svg">
  </head>
  <body>
    <div id="orientation-warning" class="orientation-warning" aria-live="polite">
      Rotate your device to landscape for the best experience.
    </div>
    <div id="app">
      <aside class="sidebar">
        <img src="/ambi.svg" alt="Ambi logo">
        <p class="subtitle">3D Ambigram generator</p>
        <form id="controls-form" class="controls-form">
          <div class="form-group">
            <label for="word1" id="word1-label">Word 1</label>
            <input type="text" id="word1" name="word1">
          </div>
          <div class="form-group">
            <label for="word2" id="word2-label">Word 2</label>
            <input type="text" id="word2" name="word2">
          </div>
          <div class="form-group">
            <label for="letter-spacing">Letter spacing</label>
            <input type="range" id="letter-spacing" name="letter-spacing" min="0" max="200" step="1" value="50">
          </div>
          <div class="form-group">
            <label for="font-selector">Font 1</label>
            <div class="font-select-row">
              <select id="font-selector" name="font"></select>
              <button
                type="button"
                class="glyph-btn"
                id="glyph-btn-1"
                title="Show available glyphs"
                aria-label="Show available glyphs for Font 1"
              >
                Aa
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="font-selector-2">Font 2</label>
            <div class="font-select-row">
              <select id="font-selector-2" name="font-2"></select>
              <button
                type="button"
                class="glyph-btn"
                id="glyph-btn-2"
                title="Show available glyphs"
                aria-label="Show available glyphs for Font 2"
              >
                Aa
              </button>
            </div>
          </div>
          <div class="form-group checkbox-group">
            <input type="checkbox" id="base-enabled" name="base-enabled" checked>
            <label for="base-enabled">Enable Base</label>
          </div>
          <div class="form-group" id="base-height-group">
            <label for="base-height" id="base-height-label">Base Height (15)</label>
            <input type="range" id="base-height" name="base-height" min="2" max="50" step="1" value="20">
          </div>
          <div id="validation-message" class="validation-message" aria-live="polite"></div>
          <button type="submit" class="generate-btn">Generate</button>
          <button type="button" id="download-stl-btn" class="generate-btn">Download STL</button>
          <div class="settings-separator">Settings</div>
          <div class="form-group">
            <label for="camera-mode">Camera</label>
            <select id="camera-mode" name="camera-mode">
              <option value="perspective" selected>Perspective</option>
              <option value="orthographic">Orthographic</option>
            </select>
          </div>
          <div class="form-group">
            <label for="material-mode">Mesh Material</label>
            <select id="material-mode" name="material-mode">
              <option value="base-color" selected>Base Color</option>
              <option value="normal-vectors">Normal Vectors</option>
              <option value="wireframe">Wireframe</option>
            </select>
          </div>
        </form>
        <footer><a href="https://github.com/ijanos/ambi">Ambi on GitHub</a></footer>
      </aside>
      <main class="viewport" id="viewer" aria-busy="true">
        <div class="viewer-loader" id="viewer-loader" role="status" aria-live="polite" aria-label="Loading 3D scene">
          <svg class="viewer-loader-svg" viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
            <circle cx="24" cy="24" r="18" class="viewer-loader-track" />
            <path d="M24 6a18 18 0 0 1 18 18" class="viewer-loader-head" />
          </svg>
        </div>
        <noscript>
          <style>
          #viewer-loader {
            display: none;
          }
          </style>
          <div class="viewer-loader" role="alert" aria-label="JavaScript required">
            <p>JavaScript and WebGL are required for this application.</p>
          </div>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
