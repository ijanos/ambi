<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ambi</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <h2 class="title">Ambi</h2>
        <div class="content">
          <form id="controls-form" class="controls-form">
            <div class="form-group">
              <label for="word1" id="word1-label">Word 1</label>
              <input type="text" id="word1" name="word1" />
            </div>
            <div class="form-group">
              <label for="word2" id="word2-label">Word 2</label>
              <input type="text" id="word2" name="word2" />
            </div>
            <div class="form-group">
              <label for="font-selector">Font</label>
              <select id="font-selector" name="font">
                <option value="arial">Arial</option>
                <option value="helvetica">Helvetica</option>
                <option value="times">Times New Roman</option>
                <option value="courier">Courier New</option>
                <option value="georgia">Georgia</option>
              </select>
            </div>
            <div id="validation-message" class="validation-message" aria-live="polite"></div>
            <button type="submit" class="generate-btn">Generate</button>
            <button type="button" id="download-stl-btn" class="generate-btn">Download STL</button>
            <div class="settings-separator">Settings</div>
            <div class="form-group">
              <label for="camera-mode">Camera</label>
              <select id="camera-mode" name="camera-mode">
                <option value="perspective" selected>Perspective</option>
                <option value="orthographic">Orthographic</option>
              </select>
            </div>
            <div class="form-group">
              <label for="material-mode">Mesh Material</label>
              <select id="material-mode" name="material-mode">
                <option value="base-color" selected>Base Color</option>
                <option value="normal-vectors">Normal Vectors</option>
              </select>
            </div>
          </form>
        </div>
        <footer class="footer"><a href="https://github.com/ijanos/ambi">Ambi on GitHub</a></footer>
      </aside>
      <main class="viewport" id="viewer">
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
