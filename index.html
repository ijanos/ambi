<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ambi</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <h2 class="title">Ambi</h2>
        <div class="content">
          <form id="controls-form" class="controls-form">
            <div class="form-group">
              <label for="word1" id="word1-label">Word 1</label>
              <input type="text" id="word1" name="word1" />
            </div>
            <div class="form-group">
              <label for="word2" id="word2-label">Word 2</label>
              <input type="text" id="word2" name="word2" />
            </div>
            <div class="form-group">
              <label for="letter-spacing">Letter spacing</label>
              <input type="range" id="letter-spacing" name="letter-spacing" min="0" max="200" step="1" value="40" />
            </div>
            <div class="form-group">
              <label for="font-selector">Font</label>
              <select id="font-selector" name="font"></select>
            </div>
            <div id="validation-message" class="validation-message" aria-live="polite"></div>
            <button type="submit" class="generate-btn">Generate</button>
            <button type="button" id="download-stl-btn" class="generate-btn">Download STL</button>
            <div class="settings-separator">Settings</div>
            <div class="form-group">
              <label for="camera-mode">Camera</label>
              <select id="camera-mode" name="camera-mode">
                <option value="perspective" selected>Perspective</option>
                <option value="orthographic">Orthographic</option>
              </select>
            </div>
            <div class="form-group">
              <label for="material-mode">Mesh Material</label>
              <select id="material-mode" name="material-mode">
                <option value="base-color" selected>Base Color</option>
                <option value="normal-vectors">Normal Vectors</option>
              </select>
            </div>
          </form>
        </div>
        <footer class="footer"><a href="https://github.com/ijanos/ambi">Ambi on GitHub</a></footer>
      </aside>
      <main class="viewport" id="viewer" aria-busy="true">
        <div class="viewer-loader" id="viewer-loader" role="status" aria-live="polite" aria-label="Loading 3D scene">
          <svg class="viewer-loader-svg" viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
            <circle cx="24" cy="24" r="18" class="viewer-loader-track" />
            <path d="M24 6a18 18 0 0 1 18 18" class="viewer-loader-head">
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 24 24"
                to="360 24 24"
                dur="0.8s"
                repeatCount="indefinite"
              />
            </path>
          </svg>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
